<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sommeil — sons calmes</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <button id="info-btn" class="icon-btn" aria-label="Informations scientifiques" title="Informations">i</button>
      </header>

      <section class="sound-picker" aria-label="Choix du son">
        <button id="sound-btn" class="sound-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="sound-label">Bruit rose</span>
          <span class="chev" aria-hidden="true">▾</span>
        </button>
        <ul id="sound-list" class="sound-list" role="listbox" hidden></ul>
      </section>

      <section class="timer" aria-label="Minuteur">
        <button id="timer-btn" class="timer-btn" aria-label="Changer la durée">
          <span id="timer-value">30</span><span class="timer-unit">min</span>
        </button>
        <div id="countdown" class="countdown" hidden></div>
      </section>

      <section class="play-wrap">
        <button id="play-btn" class="play-btn" aria-label="Lecture">
          <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
            <path id="play-icon" d="M8 5v14l11-7z" />
          </svg>
        </button>
      </section>

      <section class="volume" aria-label="Volume">
        <input id="volume" type="range" min="0" max="100" value="60" aria-label="Volume" />
      </section>
    </main>

    <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title">
      <h2 id="info-title">Bases scientifiques</h2>
      <div id="info-body"></div>
      <form method="dialog"><button class="btn-close">Fermer</button></form>
    </dialog>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
